[package]
name = "chatdock"
version = "1.7.1"
description = "Instagram, Facebook, X and Discord chats docked on the edge of your screen, always on top of your games."
authors = ["ResinCore"]
license = "MIT"
repository = "https://github.com/ResinCoreAI/ChatDock"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "=2.6.2", features = [] }

[dependencies]
tauri = { version = "=2.11.2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-single-instance = "=2.4.4"
tauri-plugin-updater = "=2.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = [
    "Wdk_Graphics_Direct3D",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
