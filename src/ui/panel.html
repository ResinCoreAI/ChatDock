<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
<title>ChatDock</title>
<link rel="stylesheet" href="panel.css">
<link rel="stylesheet" href="settings.css">
</head>
<body>
  <!-- Every text is filled in by i18n.js (data-i18n*) in the chosen language. -->
  <div id="grip" data-i18n-title="panel.resizeGrip"></div>

  <header id="bar">
    <nav class="apps" role="tablist" data-i18n-aria="panel.appsNav"></nav>
    <div class="tools">
      <button id="update" class="chip update" hidden><span data-icon="arrowUp"></span><span class="label"></span></button>
      <button id="zoom" class="chip" data-i18n-title="panel.zoom" hidden></button>
      <button id="reload" class="icon-btn" data-i18n-title="panel.reload"><span data-icon="reload"></span></button>
      <button id="pin" class="icon-btn"><span data-icon="pin"></span></button>
      <button id="settings-btn" class="icon-btn"><span data-icon="gear"></span></button>
      <button id="hide" class="icon-btn"><span class="hide-ico" data-icon="chevronRight"></span></button>
    </div>
    <div id="progress"></div>
  </header>

  <div id="banner" hidden>
    <p data-i18n-html="banner.exclusive"></p>
    <button id="banner-close" data-i18n-title="banner.close">✕</button>
  </div>

  <main id="stage">
    <section id="loading" class="center" hidden>
      <div class="spinner"></div>
      <p id="loading-text"></p>
    </section>

    <section id="error" class="center" hidden>
      <span class="err-icon" data-icon="warning"></span>
      <h2 id="error-title"></h2>
      <p data-i18n-html="error.body"></p>
      <button id="retry" class="primary" data-i18n="error.retry"></button>
    </section>

    <section id="welcome" hidden>
      <div class="welcome">
        <label class="lang-pick" data-i18n-title="welcome.language">🌐 <select data-lang-select></select></label>
        <div class="brand">
          <span class="logo" data-icon="logo"></span>
          <div>
            <h1>ChatDock</h1>
            <p data-i18n="welcome.tagline"></p>
          </div>
        </div>

        <div class="demo" aria-hidden="true">
          <div class="demo-game"><i></i><i></i><i></i></div>
          <div class="demo-pill"></div>
          <div class="demo-panel"><b></b><span class="in"></span><span class="out"></span><span class="in short"></span><span class="out"></span></div>
          <svg class="demo-cursor" viewBox="0 0 16 16"><path d="M2 1.5v11.2l3-2.9 2 4.7 2.1-.9-2-4.6h4.2z" fill="#fff" stroke="#111" stroke-width="1" stroke-linejoin="round"/></svg>
        </div>

        <ol class="steps">
          <li id="step1"></li>
          <li id="step2"></li>
          <li data-i18n-html="welcome.step3"></li>
          <li data-i18n-html="welcome.step4"></li>
        </ol>

        <div class="note" data-i18n-html="welcome.note1"></div>
        <div class="note" data-i18n-html="welcome.note2"></div>
        <div class="note" data-i18n-html="welcome.note3"></div>
        <div class="note" data-i18n-html="welcome.note4"></div>
        <div class="note subtle" data-i18n-html="welcome.note5"></div>

        <label class="check" id="autostart-row" hidden><input type="checkbox" id="autostart" checked> <span data-i18n="welcome.autostart"></span></label>
        <button id="start" class="primary big"></button>
      </div>
    </section>

    <section id="settings" hidden>
      <div class="set-top">
        <div class="set-head">
          <h1 data-i18n="set.title"></h1>
          <button class="icon-btn" data-action="close" data-i18n-title="set.close"><span data-icon="close"></span></button>
        </div>
        <nav class="set-nav" data-i18n-aria="set.nav">
          <button data-goto="general" data-i18n="nav.general"></button>
          <button data-goto="look" data-i18n="nav.look"></button>
          <button data-goto="apps" data-i18n="nav.apps"></button>
          <button data-goto="popups" data-i18n="nav.notify"></button>
          <button data-goto="security" data-i18n="nav.security"></button>
          <button data-goto="updates"><span data-i18n="nav.updates"></span><i class="dot" hidden></i></button>
          <button data-goto="about" data-i18n="nav.about"></button>
        </nav>
      </div>

      <div class="set-body">
        <!-- ─────────────── General ─────────────── -->
        <section class="group" data-section="general">
          <h2 data-i18n="set.general"></h2>
          <div class="card">
            <div class="row">
              <div class="label"><b>🌐 <span data-i18n="set.language"></span><span class="en-hint"> · Language</span></b><small data-i18n="set.languageNote"></small></div>
              <select data-pref="lang" data-lang-select></select>
            </div>
            <div class="row">
              <div class="label"><b data-i18n="set.autostart"></b><small data-text="autostartNote"></small></div>
              <label class="switch"><input type="checkbox" data-pref="autostart"><span></span></label>
            </div>
            <div class="row">
              <div class="label"><b data-i18n="set.hotkey"></b><small data-text="hotkeyNote"></small></div>
              <select data-pref="hotkey" data-hotkeys></select>
            </div>
            <div class="row">
              <div class="label"><b data-i18n="set.pinned"></b><small data-i18n="set.pinnedNote"></small></div>
              <label class="switch"><input type="checkbox" data-pref="pinned"><span></span></label>
            </div>
            <div class="row">
              <div class="label"><b data-i18n="set.muted"></b><small data-i18n="set.mutedNote"></small></div>
              <label class="switch"><input type="checkbox" data-pref="muted"><span></span></label>
            </div>
          </div>
        </section>

        <!-- ─────────────── Position & look ─────────────── -->
        <section class="group" data-section="look">
          <h2 data-i18n="set.look"></h2>
          <div class="card">
            <div class="row col">
              <div class="label"><b data-i18n="set.side"></b><small data-i18n="set.sideNote"></small></div>
              <div class="side-pick" role="radiogroup">
                <button class="mini-screen left" data-pref="side" data-value="left" role="radio"><i class="dock"></i><span data-i18n="set.left"></span></button>
                <button class="mini-screen right" data-pref="side" data-value="right" role="radio"><i class="dock"></i><span data-i18n="set.right"></span></button>
              </div>
            </div>
            <div class="row">
              <div class="label"><b data-i18n="set.edge"></b><small data-i18n="set.edgeNote"></small></div>
              <select data-pref="edgeMode">
                <option value="always" data-i18n="edge.always"></option>
                <option value="no-fullscreen" data-i18n="edge.noFullscreen"></option>
                <option value="off" data-i18n="edge.off"></option>
              </select>
            </div>
            <div class="row" data-show="multiDisplay">
              <div class="label"><b data-i18n="set.display"></b><small data-i18n="set.displayNote"></small></div>
              <select data-pref="displayId" data-type="number" data-displays></select>
            </div>
            <div class="row">
              <div class="label"><b data-i18n="set.glow"></b><small data-i18n="set.glowNote"></small></div>
              <label class="switch"><input type="checkbox" data-pref="glow"><span></span></label>
            </div>
            <div class="row col">
              <div class="label"><b data-i18n="set.theme"></b></div>
              <div class="seg" role="radiogroup">
                <button data-pref="theme" data-value="system" role="radio" data-i18n="theme.system"></button>
                <button data-pref="theme" data-value="dark" role="radio" data-i18n="theme.dark"></button>
                <button data-pref="theme" data-value="light" role="radio" data-i18n="theme.light"></button>
              </div>
            </div>
            <div class="row col">
              <div class="label"><b data-i18n="set.opacity"></b><small data-i18n="set.opacityNote"></small></div>
              <div class="range"><input type="range" min="60" max="100" step="5" data-pref="opacity" data-scale="100"><output data-out="opacity">100%</output></div>
            </div>
            <div class="row">
              <div class="label"><b data-i18n="set.width"></b><small data-i18n="set.widthNote"></small></div>
              <button class="secondary small" data-action="reset-widths" data-i18n="set.widthReset"></button>
            </div>
          </div>
        </section>

        <!-- ─────────────── Apps ─────────────── -->
        <section class="group" data-section="apps">
          <h2 data-i18n="set.apps"></h2>
          <div class="mem-line"><span class="mem-ico">🧠</span><span data-text="memory"></span></div>
          <div class="card" data-apps></div>
          <p class="hint" data-i18n="apps.hint"></p>
        </section>

        <!-- ─────────────── Notifications ─────────────── -->
        <section class="group" data-section="popups">
          <h2 data-i18n="set.notify"></h2>
          <div class="card">
            <div class="row">
              <div class="label"><b data-i18n="set.popups"></b><small data-i18n="set.popupsNote"></small></div>
              <label class="switch"><input type="checkbox" data-pref="popups"><span></span></label>
            </div>
            <div class="row col">
              <div class="label"><b data-i18n="set.dnd"></b><small data-text="dnd"></small></div>
              <div class="chips" data-dnd>
                <button data-action="dnd" data-arg="0" data-i18n="dnd.off"></button>
                <button data-action="dnd" data-arg="30" data-i18n="dnd.30"></button>
                <button data-action="dnd" data-arg="60" data-i18n="dnd.60"></button>
                <button data-action="dnd" data-arg="120" data-i18n="dnd.120"></button>
                <button data-action="dnd" data-arg="480" data-i18n="dnd.480"></button>
                <button data-action="dnd" data-arg="-1" data-i18n="dnd.forever"></button>
              </div>
            </div>
            <div class="row">
              <div class="label"><b data-i18n="set.quietFs"></b><small data-i18n="set.quietFsNote"></small></div>
              <label class="switch"><input type="checkbox" data-pref="popupQuietFullscreen"><span></span></label>
            </div>
          </div>

          <div class="card" data-dim-when="popups-off">
            <div class="row col">
              <div class="label"><b data-i18n="set.corner"></b><small data-i18n="set.cornerNote"></small></div>
              <div class="corner-pick" role="radiogroup">
                <button class="c tl" data-pref="popupPosition" data-value="top-left" role="radio" data-i18n-title="corner.tl"><i></i></button>
                <button class="c tr" data-pref="popupPosition" data-value="top-right" role="radio" data-i18n-title="corner.tr"><i></i></button>
                <button class="c bl" data-pref="popupPosition" data-value="bottom-left" role="radio" data-i18n-title="corner.bl"><i></i></button>
                <button class="c br" data-pref="popupPosition" data-value="bottom-right" role="radio" data-i18n-title="corner.br"><i></i></button>
                <span class="corner-label" data-text="cornerLabel"></span>
              </div>
            </div>
            <div class="row">
              <div class="label"><b data-i18n="set.duration"></b><small data-i18n="set.durationNote"></small></div>
              <select data-pref="popupDuration" data-type="number">
                <option value="5" data-i18n="duration.s" data-n="5"></option>
                <option value="8" data-i18n="duration.s" data-n="8"></option>
                <option value="12" data-i18n="duration.s" data-n="12"></option>
                <option value="20" data-i18n="duration.s" data-n="20"></option>
                <option value="30" data-i18n="duration.s" data-n="30"></option>
                <option value="0" data-i18n="duration.stay"></option>
              </select>
            </div>
            <div class="row col">
              <div class="label"><b data-i18n="set.max"></b><small data-i18n="set.maxNote"></small></div>
              <div class="seg" role="radiogroup">
                <button data-pref="popupMax" data-value="1" data-type="number" role="radio">1</button>
                <button data-pref="popupMax" data-value="2" data-type="number" role="radio">2</button>
                <button data-pref="popupMax" data-value="3" data-type="number" role="radio">3</button>
                <button data-pref="popupMax" data-value="4" data-type="number" role="radio">4</button>
                <button data-pref="popupMax" data-value="5" data-type="number" role="radio">5</button>
              </div>
            </div>
            <div class="row">
              <div class="label"><b data-i18n="set.text"></b><small data-i18n="set.textNote"></small></div>
              <label class="switch"><input type="checkbox" data-pref="popupText"><span></span></label>
            </div>
            <div class="row">
              <div class="label"><b data-i18n="set.avatar"></b></div>
              <label class="switch"><input type="checkbox" data-pref="popupAvatar"><span></span></label>
            </div>
            <div class="row">
              <div class="label"><b data-i18n="set.chime"></b><small data-i18n="set.chimeNote"></small></div>
              <label class="switch"><input type="checkbox" data-pref="popupSound"><span></span></label>
            </div>
            <div class="row">
              <div class="label"><b data-i18n="set.test"></b></div>
              <button class="secondary small" data-action="test-popup" data-i18n="set.testBtn"></button>
            </div>
          </div>

          <h3 class="sub" data-i18n="set.perApp"></h3>
          <p class="hint" data-i18n="set.perAppNote"></p>
          <div class="card" data-perapp></div>
        </section>

        <!-- ─────────────── Security ─────────────── -->
        <section class="group" data-section="security">
          <h2 data-i18n="set.security"></h2>
          <div class="card">
            <div class="sec-status" data-sec>
              <span class="sec-ico" data-icon="shield"></span>
              <div><b data-text="secTitle"></b><small data-text="secDesc"></small></div>
            </div>
            <ul class="facts">
              <li data-i18n="sec.fact1"></li>
              <li data-i18n="sec.fact2"></li>
              <li data-i18n="sec.fact3"></li>
              <li data-i18n="sec.fact4"></li>
              <li data-show="packaged" data-i18n="sec.fact5"></li>
              <li data-i18n="sec.fact6"></li>
            </ul>
          </div>
          <div class="card">
            <div class="row">
              <div class="label"><b data-i18n="sec.capture"></b><small data-i18n="sec.captureNote"></small></div>
              <label class="switch"><input type="checkbox" data-pref="hideFromCapture"><span></span></label>
            </div>
            <div class="row">
              <div class="label"><b data-i18n="sec.clearAll"></b><small data-i18n="sec.clearAllNote"></small></div>
              <button class="danger small" data-action="clear-all" data-confirm="confirm.again" data-i18n="sec.clearAllBtn"></button>
            </div>
          </div>
        </section>

        <!-- ─────────────── Updates ─────────────── -->
        <section class="group" data-section="updates">
          <h2 data-i18n="set.updates"></h2>
          <div class="card update-card">
            <div class="uc-top">
              <span class="uc-logo" data-icon="logo"></span>
              <div class="uc-text"><b>ChatDock <span data-text="version"></span></b><small data-text="updateStatus"></small></div>
            </div>
            <div class="uc-bar" hidden><i></i></div>
            <div class="uc-actions">
              <button class="primary" data-action="install-update" data-i18n="upd.install" hidden></button>
              <button class="primary" data-action="download-update" data-i18n="upd.download" hidden></button>
              <button class="secondary" data-action="check-update" data-i18n="upd.check"></button>
            </div>
            <div class="uc-notes" hidden><b data-text="notesTitle"></b><p data-text="notes"></p></div>
          </div>
          <div class="card">
            <div class="row">
              <div class="label"><b data-i18n="upd.autoCheck"></b><small data-i18n="upd.autoCheckNote"></small></div>
              <label class="switch"><input type="checkbox" data-pref="updateAutoCheck"><span></span></label>
            </div>
            <div class="row">
              <div class="label"><b data-i18n="upd.autoDownload"></b><small data-i18n="upd.autoDownloadNote"></small></div>
              <label class="switch"><input type="checkbox" data-pref="updateAutoDownload"><span></span></label>
            </div>
            <div class="row">
              <div class="label"><b data-i18n="upd.history"></b><small data-i18n="upd.historyNote"></small></div>
              <button class="secondary small" data-action="open-releases" data-i18n="upd.historyBtn"></button>
            </div>
          </div>
        </section>

        <!-- ─────────────── About ─────────────── -->
        <section class="group" data-section="about">
          <h2 data-i18n="set.about"></h2>
          <div class="card about">
            <span class="about-logo" data-icon="logo"></span>
            <div>
              <b>ChatDock <span data-text="version"></span></b>
              <small data-text="semver"></small>
              <small data-i18n="about.line"></small>
            </div>
          </div>
          <div class="link-row">
            <button class="secondary small" data-action="open-repo">GitHub</button>
            <button class="secondary small" data-action="open-license" data-i18n="about.license"></button>
            <button class="secondary small" data-action="help" data-i18n="about.help"></button>
            <button class="secondary small" data-action="open-logs" data-i18n="about.logs"></button>
          </div>
          <button class="danger ghost quit" data-action="quit" data-i18n="about.quit"></button>
        </section>
      </div>
    </section>
  </main>

  <script src="i18n.js"></script>
  <script src="icons.js"></script>
  <script src="panel.js"></script>
  <script src="settings.js"></script>
</body>
</html>
