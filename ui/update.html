<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src ipc: http://ipc.localhost; img-src 'self' data:">
<title>ChatDock</title>
<link rel="stylesheet" href="update.css">
</head>
<body>
  <!-- Shown for a moment when an update starts; then the installer's own progress window takes over. -->
  <div class="card" role="status" aria-live="polite">
    <div class="top">
      <span class="logo" data-icon="logo"></span>
      <div>
        <b data-i18n="updwin.title"></b>
        <small id="route"></small>
      </div>
    </div>
    <div class="bar"><i id="fill"></i></div>
    <p id="step"></p>
  </div>
  <script src="bridge.js"></script>
  <script src="i18n-data.js"></script>
  <script src="i18n.js"></script>
  <script src="icons.js"></script>
  <script src="update.js"></script>
</body>
</html>
